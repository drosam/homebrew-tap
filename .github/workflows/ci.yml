name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/drosam"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/drosam/homebrew-tap"
          brew trust drosam/tap

      - name: Audit
        run: brew audit --strict --online drosam/tap/hyperkey

      - name: Style
        run: brew style drosam/tap

      - name: Install and test
        run: |
          brew install drosam/tap/hyperkey
          brew test drosam/tap/hyperkey
